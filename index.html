    <title>Pokédex · A Trainer’s Field Guide</title>
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('pokedex:theme:v1'));
        document.documentElement.dataset.theme = ['light', 'dark'].includes(saved) ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>

    <div id="root"></div>
